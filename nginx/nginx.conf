# M3 nginx 反向代理配置：TLS 终止 + HTTP→HTTPS 重定向 + 安全头
#
# 部署步骤：
# 1. 将 TLS 证书放置到 ./nginx/certs/ 目录（fullchain.pem + privkey.pem）
#    生产环境建议用 Let's Encrypt（certbot）或 Caddy 自动签发
# 2. 修改 server_name 为你的域名
# 3. 启动：docker-compose --profile tls up -d
#
# 此配置实现：
# - 80 端口：301 永久重定向到 443（HTTP→HTTPS）
# - 443 端口：TLS 终止 + HTTP/2 + gzip 压缩 + 反向代理到后端 api/web 服务
# - 传递 X-Forwarded-Proto: https 让应用层识别真实协议
# - 传递 X-Forwarded-For 让应用层获取真实客户端 IP（配合 trust_forwarded_headers=true）

# P1 限流兜底：应用层 middleware.py 已实现滑动窗口限流（默认 60 req/min/client_id），
# 但若应用层限流被绕过（直接命中后端、IP 提取错误、应用 bug），nginx 层无任何保护。
# 此处定义 limit_req/limit_conn zone 作为纵深防御：
# - 请求速率：10 req/s/IP（≈600 req/min），突发 20 req 排队，超出返回 503
#   比应用层 60 req/min 宽松 10 倍，仅兜底极端情况，正常流量不受影响
# - 并发连接：单 IP 最多 50 个并发连接，防止 Slowloris / 连接耗尽
# 注意：$binary_remote_addr 用二进制 IP 作为 key，比 $remote_addr 节省内存
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=api_cl:10m;

# P1 慢连接防护：缩短超时，防止 Slowloris 攻击占用连接
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 15s;

# P1 限流响应：被限流时返回 503（与后端限流行为一致），日志记录被限流请求
limit_req_status 503;
limit_conn_status 503;

# P1 性能：gzip 压缩配置（在 server 块内继承生效）
# 压缩 API 返回的 JSON / Streamlit 静态资源，减少带宽占用与首屏耗时
# 注意：gzip 不能压缩 SSE 流（/chat/stream），因为 SSE 是逐 chunk 推送，
# nginx 会因 buffering off 而直接透传，无需特殊处理
gzip on;
gzip_comp_level 5;                       # 压缩级别 1-9，5 为带宽与 CPU 的平衡点
gzip_min_length 1024;                     # 小于 1KB 的响应不压缩（压缩收益低且增加 CPU 开销）
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/atom+xml
    image/svg+xml
    application/x-ndjson;                 # SSE 流（虽然不会被压缩，但保持类型完整）
gzip_vary on;                             # 增加 Vary: Accept-Encoding 响应头，配合 CDN 缓存
gzip_proxied any;                         # 对所有经过代理的请求启用压缩（默认 no-cache 时才压缩）
gzip_disable "MSIE [1-6]\.";              # 兼容老版 IE（不支持 gzip 的实现）

# 80 端口：HTTP → HTTPS 重定向（应用层 HTTPSRedirectMiddleware 的补充防线）
server {
    listen 80;
    # 健康检查豁免：容器探活走 HTTP，不重定向，也不限流（避免探活被限流误杀）
    location ~ ^/health(/deep)?$ {
        proxy_pass http://api_tls:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 其余请求 301 重定向到 HTTPS（重定向本身不消耗后端资源，不严格限流）
    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 端口：TLS 终止 + HTTP/2 + 反向代理
server {
    # P1 性能：启用 HTTP/2，多路复用减少 TLS 握手开销，提升并发性能
    # 注意：HTTP/2 不兼容旧版浏览器（IE 9-），但现代浏览器均支持
    listen 443 ssl http2;
    # 修改为你的域名，如 agent.example.com
    server_name _;

    # P0 修复：与应用层 MAX_REQUEST_BODY_SIZE (10MB) 对齐，否则 nginx 默认 1MB
    # 会在知识库批量上传 /knowledge/batch-upload (最多 5MB) 时返回 413 拦截
    client_max_body_size 10m;

    # TLS 证书路径（挂载自 ./nginx/certs/）
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 安全配置：仅启用现代密码套件，禁用旧协议
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头（nginx 层补充，应用层 SecurityHeadersMiddleware 也会设置，双重保障）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API 服务反向代理
    # P1：tls profile 下后端容器名为 api_tls/web_tls（compose 服务名即容器名）
    location / {
        # P1 限流兜底：应用层限流被绕过时的最后一道防线
        # burst=20 允许短时突发，nodelay 保证不延迟正常请求
        # 应用层限流 60 req/min，nginx 设 600 req/min（10 倍宽松），仅兜底极端情况
        limit_req zone=api_rl burst=20 nodelay;
        limit_conn api_cl 50;

        proxy_pass http://api_tls:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应支持（/chat/stream 端点需要）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Streamlit Web UI（如需通过同一域名访问）
    location /web/ {
        # P1 限流兜底：Streamlit UI 也加限流，防止 XSS/CSRF 触发的批量请求
        limit_req zone=api_rl burst=20 nodelay;
        limit_conn api_cl 50;

        proxy_pass http://web_tls:8501/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
