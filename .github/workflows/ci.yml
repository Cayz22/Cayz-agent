name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # numpy 2.5+ 要求 Python >=3.12，移除 3.11
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies from lock file
        run: |
          python -m pip install --upgrade pip
          # 从 requirements.lock 安装精确版本，确保 CI 可复现
          pip install -r requirements.lock
          # 安装项目自身（不拉依赖，避免覆盖 lock 版本）+ dev 工具（带版本约束）
          pip install --no-deps -e .
          pip install "pytest~=9.1.0" "pytest-cov~=7.1.0" "httpx~=0.28.0"

      - name: Run tests with coverage
        # 保存测试输出到文件，便于失败时通过 artifact 下载分析
        run: |
          pytest tests/ -v \
            --cov=cayz_agent \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            --junitxml=test-results.xml \
            2>&1 | tee test-output.log
          exit ${PIPESTATUS[0]}

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.python-version }}
          path: |
            test-output.log
            test-results.xml

      - name: Upload coverage report
        if: matrix.python-version == '3.13' && success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ruff (locked version)
        run: pip install "ruff~=0.7.0"

      - name: Run ruff check
        run: ruff check cayz_agent/ tests/

      - name: Run ruff format check
        run: ruff format --check cayz_agent/ tests/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies (CVE 扫描)
        # 基于 requirements.lock 扫描，确保审计的是实际部署的精确版本
        # 不使用 --strict，只报告直接依赖的已知漏洞，避免子依赖 CVE 误报
        # --ignore-vuln=PYSEC-2026-311：chromadb 1.5.9 的 trust_remote_code 漏洞，
        #   当前已是最新版（1.5.9），上游尚未发布修复版本。
        #   本项目不直接调用 trust_remote_code=true，风险可控。
        run: |
          pip-audit \
            --requirement requirements.lock \
            --desc on \
            --ignore-vuln=PYSEC-2026-311

      - name: Run Trivy filesystem scan (源码漏洞 + 配置错误)
        # P1 供应链加固：固定 trivy-action 到具体版本 tag，避免 @master 可变引用
        # 旧实现 @master 上游任何提交（含被入侵后的恶意提交）会立即在下次 CI 生效
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  docker:
    needs: [test, lint, security]
    runs-on: ubuntu-latest
    # 仅在 main 分支推送或打 tag 时构建镜像
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy (pinned version)
        # P1 供应链加固：从 GitHub Release 下载固定版本二进制并校验 SHA256
        # 旧实现 curl|sh 从 main 分支动态拉取安装脚本，脚本内容随时可能变化
        run: |
          TRIVY_VERSION=0.55.0
          curl -sfL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sfL -o /tmp/trivy.sha256 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz.sha256"
          # 校验 SHA256（文件格式：<hash>  <filename>）
          cd /tmp && sha256sum -c trivy.sha256
          tar -xzf trivy.tar.gz -C /usr/local/bin trivy
          trivy --version

      - name: Trivy 镜像漏洞扫描
        # P1 修复：扫描实际推送的标签，而非硬编码 :main
        # 旧实现 tag 发布时扫描的仍是上一次 main 推送的过期镜像，给发布安全以假象
        # 取 steps.meta.outputs.tags 的第一个标签作为扫描目标
        run: |
          # 将多行 tags 转为数组，取第一个
          TAGS="${{ steps.meta.outputs.tags }}"
          FIRST_TAG=$(echo "$TAGS" | head -n1 | tr -d ' ')
          echo "扫描镜像: $FIRST_TAG"
          docker pull "$FIRST_TAG"
          trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed "$FIRST_TAG"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
