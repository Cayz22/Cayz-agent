name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # numpy 2.5+ 要求 Python >=3.12，移除 3.11
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies from lock file
        run: |
          python -m pip install --upgrade pip
          # 从 requirements.lock 安装精确版本，确保 CI 可复现
          pip install -r requirements.lock
          # 安装项目自身（不拉依赖，避免覆盖 lock 版本）+ dev 工具（带版本约束）
          pip install --no-deps -e .
          pip install "pytest~=9.1.0" "pytest-cov~=7.1.0" "httpx~=0.28.0"

      - name: Run tests with coverage
        # 保存测试输出到文件，便于失败时通过 artifact 下载分析
        run: |
          pytest tests/ -v \
            --cov=cayz_agent \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            --junitxml=test-results.xml \
            2>&1 | tee test-output.log
          exit ${PIPESTATUS[0]}

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.python-version }}
          path: |
            test-output.log
            test-results.xml

      - name: Upload coverage report
        if: matrix.python-version == '3.13' && success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ruff (locked version)
        run: pip install "ruff~=0.7.0"

      - name: Run ruff check
        run: ruff check cayz_agent/ tests/

      - name: Run ruff format check
        run: ruff format --check cayz_agent/ tests/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies (CVE 扫描)
        # 基于 requirements.lock 扫描，确保审计的是实际部署的精确版本
        # 不使用 --strict，只报告直接依赖的已知漏洞，避免子依赖 CVE 误报
        # --ignore-vuln=PYSEC-2026-311：chromadb 1.5.9 的 trust_remote_code 漏洞，
        #   当前已是最新版（1.5.9），上游尚未发布修复版本。
        #   本项目不直接调用 trust_remote_code=true，风险可控。
        run: |
          pip-audit \
            --requirement requirements.lock \
            --desc on \
            --ignore-vuln=PYSEC-2026-311

      - name: Run Trivy filesystem scan (源码漏洞 + 配置错误)
        # P1 供应链加固：固定 trivy-action 到具体版本 tag，避免 @master 可变引用
        # 旧实现 @master 上游任何提交（含被入侵后的恶意提交）会立即在下次 CI 生效
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  docker:
    needs: [test, lint, security]
    runs-on: ubuntu-latest
    # 仅在 main 分支推送或打 tag 时构建镜像
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy (pinned version)
        # P1 供应链加固：固定版本 + 经 GitHub API 取真实资产 URL（不手拼命名，杜绝 404）。
        # 本步 EXPECTED_SHA256 留空 = 先确保 CI 绿，并打印实际 sha256；
        # 绿后把打印值填进 EXPECTED_SHA256，即升级为「带外 pin hash」真加固（见末尾说明）。
        env:
          TRIVY_VERSION: "0.69.3"          # 0.60.0 已被供应链善后清理→404；0.69.4 是投毒版禁用
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA256: "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"              # 留空=只打印不校验；填 64 位 hex=启用带外校验
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/aquasecurity/trivy/releases/tags/v${TRIVY_VERSION}"
          HDR=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          # 1) 取该 tag 的 release 元数据:tag 不存在则 API 404,这里明确报错,不再 exit 22 干瞪眼
          if ! REL=$(curl --retry 3 --retry-delay 5 -fsSL "${HDR[@]}" "$API" 2>/tmp/api_err); then
            echo "::error::获取 release v${TRIVY_VERSION} 失败（该版本可能不存在/已被清理)。curl 详情："
            cat /tmp/api_err || true
            echo "请把 TRIVY_VERSION 改成真实存在的版本，例如 0.60.0 / 0.69.3(避开 0.69.4)。"
            exit 1
          fi

          # 2) 运行时挑 Linux/amd64 压缩包，兼容 64bit / AMD64 / amd64 历史命名
          TAR_NAME=$(echo "$REL" | jq -r --arg v "$TRIVY_VERSION" \
            '[.assets[].name | select(test("^trivy_\($v)_Linux-(64bit|AMD64|amd64)\\.tar\\.gz$"))] | .[0] // empty')
          if [ -z "${TAR_NAME}" ]; then
            echo "::error::v${TRIVY_VERSION} 的 release 里没有 Linux/amd64 的 tar.gz。该版本实际资产如下,请据此换版本："
            echo "$REL" | jq -r '.assets[].name'
            exit 1
          fi
          TAR_URL=$(echo "$REL" | jq -r --arg n "$TAR_NAME" '.assets[] | select(.name==$n) | .browser_download_url')
          echo "将下载: ${TAR_NAME}  (${TAR_URL})"

          # 3) 用 API 给的真实 URL 下载（不再猜命名）
          curl --retry 3 --retry-delay 5 -fL "${HDR[@]}" \
            -H "Accept: application/octet-stream" -o /tmp/trivy.tar.gz "$TAR_URL"

          # 4) 校验(可选):EXPECTED_SHA256 非空才比对；为空只打印，便于首次取 hash
          got=$(sha256sum /tmp/trivy.tar.gz | awk '{print $1}')
          echo "actual sha256: ${got}"
          if [ -n "${EXPECTED_SHA256}" ] && [ "${got}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::SHA256 不匹配 期望=${EXPECTED_SHA256} 实际=${got}"
            exit 1
          fi

          tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy --version

      - name: Trivy 镜像漏洞扫描
        # P1 修复：扫描实际推送的标签，而非硬编码 :main
        # 旧实现 tag 发布时扫描的仍是上一次 main 推送的过期镜像，给发布安全以假象
        # 取 steps.meta.outputs.tags 的第一个标签作为扫描目标
        run: |
          # 将多行 tags 转为数组，取第一个
          TAGS="${{ steps.meta.outputs.tags }}"
          FIRST_TAG=$(echo "$TAGS" | head -n1 | tr -d ' ')
          echo "扫描镜像: $FIRST_TAG"
          docker pull "$FIRST_TAG"
          trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --ignorefile .trivyignore "$FIRST_TAG"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
